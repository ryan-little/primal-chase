<!doctype html><html><body><script type="module">
import { makeNoise } from '../js/util.js';
const out = {};
for (const [name, sc, oct] of [['A',5200,2],['H',4200,2],['V',3600,2]]) {
  const vals = [];
  for (let s = 1; s <= 4; s++) { const n = makeNoise(s * 13 + 7); for (let k = 0; k < 3000; k++) { const a = Math.random()*6.28, r = Math.sqrt(Math.random())*8500; vals.push(n.fbm(Math.cos(a)*r/sc, Math.sin(a)*r/sc, oct)); } }
  vals.sort((a,b)=>a-b); out[name] = [0.05,0.1,0.15,0.2,0.3,0.5,0.7,0.8,0.85,0.9,0.95].map(q => vals[Math.floor(q*vals.length)].toFixed(2)).join(' ');
}
window.result = out;
</script></body></html>
