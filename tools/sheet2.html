<!doctype html><html><body style="margin:0;background:#c2a64a">
<canvas id="c" width="1400" height="900" style="image-rendering:pixelated"></canvas>
<script type="module">
import { buildArt } from '../js/art.js';
const A = buildArt();
const c = document.getElementById('c'), x = c.getContext('2d'); x.imageSmoothingEnabled = false;
const S = 3; let X = 4, Y = 4, rowH = 0;
function put(img){ if (X + img.width*S > 1400){X=4;Y+=rowH+6;rowH=0;} x.drawImage(img,X,Y,img.width*S,img.height*S); X+=img.width*S+6; rowH=Math.max(rowH,img.height*S); }
function nl(){X=4;Y+=rowH+10;rowH=0;}
for (const k of ['zebra','warthog','hyrax','lion','golden']) { for (const g of ['run','idle']) (A[k][g]||[]).forEach(put); nl(); }
A.lion.lie.slice(0,2).forEach(put); nl();
for (const k of ['ostrich','fowl','flamingo']) { for (const g of ['run','idle','fly']) (A[k][g]||[]).forEach(put); nl(); }
put(A.smallCarcass);
</script></body></html>
