<!doctype html><html><body><script type="module">
import { Audio } from '../js/audio.js';
const stats = (buf, sr) => {
  let pk = 0, sum = 0, nan = 0, first = -1, last = 0;
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  for (let i = 0; i < L.length; i++) {
    const v = Math.max(Math.abs(L[i]), Math.abs(R[i]));
    if (!Number.isFinite(L[i]) || !Number.isFinite(R[i])) { nan++; continue; }
    pk = Math.max(pk, v); sum += v * v;
    if (v > 0.01) { if (first < 0) first = i; last = i; }
  }
  let asum = 0;
  for (let i = Math.max(0, first); i <= last; i++) { const v = Math.max(Math.abs(L[i]), Math.abs(R[i])); asum += v * v; }
  return { peak: +pk.toFixed(3), rms: +Math.sqrt(sum / L.length).toFixed(3), arms: first < 0 ? 0 : +Math.sqrt(asum / (last - first + 1)).toFixed(3), dur: +(last / sr).toFixed(2), nan };
};
window.render = async (intensity, night, secs, sfx, biome = 0, menu = false, wx = {}) => {
  const sr = 22050;
  const off = new OfflineAudioContext(2, sr * secs, sr);
  const a = new Audio(); a.init(off); a.menu = menu; a.intensity = intensity; a.night = night; a.biome = biome; a.amb.gain.value = 0;
  Object.assign(a, wx);
  a.log = [];
  const spb = 60 / a.tempo / 4;
  let t = 0.05, step = 0;
  while (t < secs - 0.5) { a.schedule(step++, t, spb); t += spb; }
  const buf = await off.startRendering();
  const d = buf.getChannelData(0);
  const per = [];
  for (let s = 0; s < secs; s++) { let pk = 0, sum = 0; for (let i = s * sr; i < (s + 1) * sr; i++) { const v = Math.abs(d[i]); pk = Math.max(pk, v); sum += v * v; } per.push([+pk.toFixed(2), +Math.sqrt(sum / sr).toFixed(3)]); }
  return { per, log: a.log, all: stats(buf, sr) };
};
// Drive the real update() loop through a timeline of state changes, e.g.
// [[0, {biome: 0}], [20, {rain: 1, storm: 1}], ...]; mix picks which buses are heard.
window.live = async (secs, timeline, mix = { music: 1, amb: 1, sfx: 1 }) => {
  const sr = 22050, dt = 0.05;
  const off = new OfflineAudioContext(2, sr * secs, sr);
  const a = new Audio(); a.init(off); a.menu = false; a.log = [];
  a.music.gain.value *= mix.music; a.amb.gain.value *= mix.amb; a.sfx.gain.value *= mix.sfx;
  const stings = []; const orig = a.sting.bind(a); a.sting = (k) => { stings.push(`${off.currentTime.toFixed(1)}:${k}`); orig(k); };
  const tl = timeline.slice();
  for (let t = dt; t < secs - 0.2; t += dt) {
    off.suspend(+t.toFixed(4)).then(() => {
      while (tl.length && tl[0][0] <= off.currentTime) Object.assign(a, tl.shift()[1]);
      a.update(dt);
      off.resume();
    });
  }
  const buf = await off.startRendering();
  const d = buf.getChannelData(0), per = [];
  const win = 5;
  for (let s = 0; s + win <= secs; s += win) { let pk = 0, sum = 0; for (let i = s * sr; i < (s + win) * sr; i++) { const v = Math.abs(d[i]); pk = Math.max(pk, v); sum += v * v; } per.push([+pk.toFixed(2), +Math.sqrt(sum / (win * sr)).toFixed(3)]); }
  return { per, log: a.log, stings, all: stats(buf, sr) };
};
window.sfx = async (name, opts = {}) => {
  const sr = 22050, secs = 3.5;
  const off = new OfflineAudioContext(2, sr * secs, sr);
  const a = new Audio(); a.init(off); a.menu = true; a.playing = false; a.amb.gain.value = 0;
  if (['dawn', 'dusk', 'death', 'start', 'rain', 'storm', 'heat', 'dust', 'fog'].includes(name)) a.sting(name);
  else a.play(name, opts);
  const buf = await off.startRendering();
  return { name, ...stats(buf, sr) };
};
window.ready = true;
</script></body></html>
